name: MaskMe
options:
  bundleIdPrefix: com.maskme
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MosaicCore:
    # The MediaPipe-free core lives at the repo root as a SwiftPM package
    # (Sources/MosaicCore, Package.swift).
    path: .
  OpenCV:
    # 疎LKオプティカルフロー（goodFeaturesToTrack + calcOpticalFlowPyrLK）専用。
    # 公式CocoaPods 'OpenCV' は4.3.0(2020)で停止しておりarm64シミュレータ非対応のため
    # 公式ソースビルドのSwiftPM binary配布を使う（Apache-2.0、Task 2 Step 1で検証済み）。
    url: https://github.com/yeatse/opencv-spm
    from: "5.0.0"   # Step 1で確認した最新安定版（公式OpenCVソースからのビルド、ios-arm64-simulatorスライス含む）

targets:
  MaskMe:
    type: application
    platform: iOS
    sources:
      - path: MaskMe
    dependencies:
      - package: MosaicCore
        product: MosaicCore
      # OpenCV は直接リンクしない。MediaPipe の graph static library が OpenCV 4.13 を
      # 内包しているため、アプリターゲットで OpenCV 5.0 をリンクするとシンボル衝突で
      # ABI が混線する。OpenCV 依存は OpticalFlowKit(動的framework) に隔離してある。
      - target: OpticalFlowKit
    settings:
      base:
        INFOPLIST_FILE: MaskMe/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.maskme.app
        DEVELOPMENT_TEAM: 8694X8U5SQ
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: MaskMe/MaskMe-Bridging-Header.h
    info:
      path: MaskMe/Info.plist
      properties:
        CFBundleDisplayName: Mask Me
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: 編集する写真・動画を読み込むために写真ライブラリへアクセスします。
        NSCameraUsageDescription: モザイクを掛けながら撮影するためにカメラへアクセスします。
        NSMicrophoneUsageDescription: 動画撮影に音声を含めるためにマイクへアクセスします。許可しない場合は無音で録画されます。
        NSPhotoLibraryAddUsageDescription: モザイク加工した写真・動画を保存するために写真ライブラリへアクセスします。
    # Generates a shared "MaskMe" scheme so `xcodebuild -scheme MaskMe`
    # (and SwiftPM package resolution) works in CI. The detection-accuracy
    # tests run under this scheme (`xcodebuild test` / Cmd+U).
    scheme:
      testTargets:
        - MaskMeTests
        - MaskMeUITests

  # OpenCV 疎 LK オプティカルフローのラッパー framework。
  # OpenCV を使ってよいのはこのターゲットだけ（公開 API は Foundation/UIKit 型のみ）。
  # 動的 framework に隔離する理由は OpticalFlowKit/OpticalFlowKit.h のコメント参照
  # （MediaPipe 内包の OpenCV 4.13 とのシンボル衝突回避）。
  OpticalFlowKit:
    type: framework
    platform: iOS
    sources:
      - path: OpticalFlowKit
        headerVisibility: public
    dependencies:
      - package: OpenCV
      - sdk: UIKit.framework
      - sdk: CoreGraphics.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maskme.opticalflowkit
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  # Unit-test target for real-image face-detection accuracy. Requires the
  # MediaPipe pod + face_landmarker.task model + fixture images, so it runs on a
  # Simulator / device — not in the pod-free CI build. See MaskMeTests/Fixtures.
  MaskMeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MaskMeTests
        excludes:
          - "Fixtures/**"
      # Bundle Fixtures as a folder reference so the faces/ and nonfaces/
      # subdirectories survive into the test bundle (FixtureLoader looks them up
      # with `subdirectory:`).
      - path: MaskMeTests/Fixtures
        type: folder
    dependencies:
      - target: MaskMe
      - package: MosaicCore
        product: MosaicCore
      # NOTE: OpenCV はここに追加しないこと（追加すると Xcode が OpenCV product を
      # 動的 PackageProduct 化してシンボルが欠落する）。テストは TEST_HOST (MaskMe.app)
      # に埋め込まれた OpticalFlowKit 経由で OpticalFlowTracker にアクセスできる。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maskme.app.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MaskMe.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MaskMe"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # 指の操作（払う・長押しドラッグ・つまむ）の検証。**ジェスチャの取り合いは
  # 実際に触らないと決まらない**ため、純ロジックのテストでは素通りする事故
  # （クリップの上を払っても横スクロールしない等）をここで塞ぐ。
  # MediaPipe には依存しないので Pods の結線は不要（Podfile にも入れない）。
  # 起動は `-uiTestSeedVideo` で合成動画を種にする（MaskMe/UITestBootstrap.swift）。
  MaskMeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MaskMeUITests
    dependencies:
      - target: MaskMe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maskme.app.uitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MaskMe
