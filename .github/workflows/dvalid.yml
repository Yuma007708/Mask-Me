name: Detection Accuracy (5本サンプル動画)

on:
  workflow_dispatch:
    inputs:
      backends:
        description: '回す backend（カンマ区切り、サブセット可）'
        default: 'off,faceDetector,yunet'
        required: false
      videos:
        description: '回す動画（カンマ区切り、サブセット可）'
        default: 's1,s2,s3,s4,s5'
        required: false
      halves:
        description: '回す半分（カンマ区切り、サブセット可。A=前半 B=後半）'
        default: 'A,B'
        required: false

jobs:
  test:
    name: ${{ matrix.video }} / ${{ matrix.backend }} / ${{ matrix.half }}
    runs-on: macos-15
    # s3 の A/B ハーフは 1 attempt に 35〜48 分かかるため、VM クラッシュで
    # 1 回リトライすると 60 分では attempt 2 の途中で確実に詰む（2 回実測）。
    # 2 attempt 分 + 余裕で 90 分。
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        video: [s1, s2, s3, s4, s5]
        backend: [off, faceDetector, yunet]
        half: [A, B]

    steps:
      - name: Skip if not in input subset
        id: subset
        run: |
          IFS=',' read -ra VIDEOS <<< "${{ inputs.videos || 's1,s2,s3,s4,s5' }}"
          IFS=',' read -ra BACKENDS <<< "${{ inputs.backends || 'off,faceDetector,yunet' }}"
          IFS=',' read -ra HALVES <<< "${{ inputs.halves || 'A,B' }}"
          ok=false
          for v in "${VIDEOS[@]}"; do
            [ "$v" = "${{ matrix.video }}" ] || continue
            for b in "${BACKENDS[@]}"; do
              [ "$b" = "${{ matrix.backend }}" ] || continue
              for h in "${HALVES[@]}"; do
                [ "$h" = "${{ matrix.half }}" ] && ok=true
              done
            done
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.subset.outputs.ok == 'true'
        uses: actions/checkout@v4

      - name: Select Xcode
        if: steps.subset.outputs.ok == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache CocoaPods
        if: steps.subset.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install xcodegen
        if: steps.subset.outputs.ok == 'true'
        run: brew install xcodegen

      - name: Download sample videos from Pexels
        if: steps.subset.outputs.ok == 'true'
        run: |
          # 公開 Pexels 動画（無料・商用可・アトリビューション不要）を使用する。
          # /download/video/{ID}/ が 302 で videos.pexels.com の直 MP4 に redirect するので
          # curl -L のみで取得できる（gdown / Drive secret 不要）。
          #
          # === CI デフォルト: BRIGHT セット ===
          # 顔クッキリ close-up 5 本。3 backend × 5 videos × 2 halves = 30 テスト、
          # 実測 iPhone 17 Pro Simulator で 9 分・全て rate=bridged=100% を確認済み。
          # SN 比が最も高いのでレグレッション検知のベースライン用途。
          #
          #  s1 = 4769796 / curly hair woman close-up / 11.2s / 1080x1920 (portrait)
          #  s2 = 4888198 / thoughtful man close-up  /  6.4s / 1920x1080 (landscape)
          #  s3 = 8056845 / elegant woman            / 18.0s / 1920x1080 (landscape)
          #  s4 = 8048443 / woman talking (headphones)/14.2s / 1080x1920 (portrait)
          #  s5 = 8124136 / woman talking (window)   /  9.5s / 1080x1920 (portrait)
          #
          # === 手動切替用: DIM セット（薄暗い挙動の regression 用）===
          # 手元検証で MP 単独 63〜100% / enhance path 経由の bridged 96〜100% を確認済み。
          # 5 本入替の代わりに一時的に Video ID を差し替えて workflow_dispatch。
          #  s1 = 34725792 / moody man tube-light / 16.3s
          #  s2 = 34725795 / contemplative man    / 15.4s
          #  s3 = 34725797 / introspective man    / 16.6s
          #  s4 = 8496812  / man dark room        /  9.1s
          #  s5 = 9943152  / woman hoodie 4K      / 12.2s
          #
          # === 手動切替用: BEACH セット（体誤検知 regression 用）===
          # シャツレス/水着で顔＋露出肌が同時に映る素材。5 本すべてで真の体誤検知
          # （bh > 0.5 の体級 bbox / bh/bw の逸脱）は観測されず。
          #  s1 = 8858138  / shirtless man shades / 15.3s
          #  s2 = 8621339  / smiling man beach    /  7.7s
          #  s3 = 6012393  / female swimmer cam   /  8.2s
          #  s4 = 6012315  / swimmer look cam     / 14.4s
          #  s5 = 12169428 / beach volleyball     /  8.1s
          mkdir -p /tmp/samples
          cd /tmp/samples
          declare -A URLS=(
            [s1]=4769796
            [s2]=4888198
            [s3]=8056845
            [s4]=8048443
            [s5]=8124136
          )
          for name in s1 s2 s3 s4 s5; do
            id=${URLS[$name]}
            echo "==> $name.mov (Pexels $id)"
            curl -fSL --retry 3 -A "Mozilla/5.0" \
              "https://www.pexels.com/download/video/$id/" -o "$name.mov"
          done
          ls -la s*.mov

      - name: xcodegen
        if: steps.subset.outputs.ok == 'true'
        run: xcodegen generate

      - name: Inject SAMPLE_VIDEO_DIR into xcscheme TestAction
        if: steps.subset.outputs.ok == 'true'
        run: |
          python3 - << 'PYEOF'
          import re, pathlib
          p = pathlib.Path('MaskMe.xcodeproj/xcshareddata/xcschemes/MaskMe.xcscheme')
          content = p.read_text()
          # Disable "use launch scheme env" in TestAction so test-specific env vars take effect
          content = re.sub(
              r'(<TestAction\b(?:[^>]|\n)*?)shouldUseLaunchSchemeArgsEnv\s*=\s*"YES"',
              r'\1shouldUseLaunchSchemeArgsEnv = "NO"',
              content
          )
          # Inject SAMPLE_VIDEO_DIR before </TestAction>
          env_xml = (
              '\n            <EnvironmentVariables>\n'
              '               <EnvironmentVariable\n'
              '                  key = "SAMPLE_VIDEO_DIR"\n'
              '                  value = "/tmp/samples"\n'
              '                  isEnabled = "YES">\n'
              '               </EnvironmentVariable>\n'
              '            </EnvironmentVariables>'
          )
          content = content.replace('</TestAction>', env_xml + '\n         </TestAction>', 1)
          p.write_text(content)
          print('Injected SAMPLE_VIDEO_DIR into MaskMe.xcscheme TestAction')
          PYEOF

      - name: pod install
        if: steps.subset.outputs.ok == 'true'
        run: pod install --no-repo-update

      - name: Run XCTest
        if: steps.subset.outputs.ok == 'true'
        run: |
          TEST_BACKEND="${{ matrix.backend }}"
          case "$TEST_BACKEND" in
            faceDetector) TEST_BACKEND_SUFFIX="faceDet" ;;
            *)            TEST_BACKEND_SUFFIX="$TEST_BACKEND" ;;
          esac
          UPPER=$(echo "${{ matrix.video }}" | tr '[:lower:]' '[:upper:]')
          TEST_NAME="test_${UPPER}_${TEST_BACKEND_SUFFIX}_${{ matrix.half }}"
          echo "Running $TEST_NAME"

          # 利用可能な最新 iPhone シミュレータの UUID を取得
          SIM_UUID=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "Simulator UUID: $SIM_UUID"

          set -o pipefail
          # 動画 1 本分の連続 detect 呼び出し中に、シミュレータ上でテストプロセスが
          # 稀に無言で異常終了する（0 tests executed）ことがある。backend・動画長を問わず
          # 確率的に起きる infra 起因の flaky と判断しており、クラッシュレポートも
          # 取得できていないため、失敗時はテストプロセスを最大 3 回まで再試行する。
          max_attempts=3
          attempt=1
          until xcodebuild test \
            -workspace MaskMe.xcworkspace \
            -scheme MaskMe \
            -destination "platform=iOS Simulator,id=$SIM_UUID" \
            -only-testing:"MaskMeTests/DValidVideoTests/$TEST_NAME" \
            2>&1 | tee test.log
          do
            ec=${PIPESTATUS[0]}
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::$TEST_NAME failed after $attempt attempts (exit $ec)"
              exit "$ec"
            fi
            echo "::warning::$TEST_NAME attempt $attempt failed (exit $ec), retrying ($((attempt + 1))/$max_attempts)"
            attempt=$((attempt + 1))
          done

      - name: Extract result line
        if: always() && steps.subset.outputs.ok == 'true'
        run: |
          grep -E "\[DVALRESULT\]" test.log > result.json || true
          cat result.json || true

      - name: Upload artifact
        if: always() && steps.subset.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.video }}-${{ matrix.backend }}-${{ matrix.half }}
          path: |
            test.log
            result.json
          retention-days: 14

  summary:
    name: Aggregate results
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build summary table
        run: |
          python3 <<'PYEOF'
          import json, glob, os, re
          from collections import defaultdict
          rows = []
          for path in sorted(glob.glob('artifacts/result-*/result.json')):
              text = open(path).read()
              m = re.search(r'\{.*\}', text)
              if not m:
                  continue
              try:
                  d = json.loads(m.group(0))
              except Exception:
                  continue
              rows.append(d)

          # 動画は前半(A)/後半(B)を別プロセスで走らせているので、集計では
          # (video, backend) ごとに前半+後半を合算して元の「動画全体」の指標に戻す。
          merged = defaultdict(lambda: {'hit': 0, 'total': 0, 'lowCy': 0,
                                          'jumpBig': 0, 'pairCount': 0,
                                          'sumJumpWeighted': 0.0, 'baseline': 0.0,
                                          'bridgedHit': 0, 'bridgedHit10': 0,
                                          'flowHit': 0, 'srcFlow': 0,
                                          'srcMp': 0, 'srcEnh': 0, 'srcBbox': 0,
                                          'srcRoi': 0, 'srcLow': 0, 'srcTile': 0,
                                          'halves': []})
          for d in rows:
              key = (d.get('video', ''), d.get('backend', ''))
              m = merged[key]
              m['hit'] += d.get('hit', 0)
              m['total'] += d.get('total', 0)
              m['lowCy'] += d.get('lowCy', 0)
              m['jumpBig'] += d.get('jumpBig', 0)
              m['pairCount'] += d.get('pairCount', 0)
              m['sumJumpWeighted'] += d.get('avgJump', 0.0) * d.get('pairCount', 0)
              m['baseline'] = d.get('baseline', 0.0)
              m['bridgedHit'] += d.get('bridgedHit', 0)
              m['bridgedHit10'] += d.get('bridgedHit10', 0)
              m['flowHit'] += d.get('flowHit', 0)
              m['srcFlow'] += d.get('srcFlow', 0)
              m['srcMp'] += d.get('srcMp', 0)
              m['srcEnh'] += d.get('srcEnh', 0)
              m['srcBbox'] += d.get('srcBbox', 0)
              m['srcRoi'] += d.get('srcRoi', 0)
              m['srcLow'] += d.get('srcLow', 0)
              m['srcTile'] += d.get('srcTile', 0)
              m['halves'].append(d.get('half', '?'))

          out = ['# Detection Accuracy Summary', '',
                 '| 動画 | backend | half | hit | total | rate | flow | baseline | Δ | bridged | bridged10 | lowCy% | avgJump | jumpBig% | src mp/enh/bbox/roi/low/tile/flow |',
                 '|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|']
          for (video, backend), m in sorted(merged.items()):
              total = m['total']
              rate = (m['hit'] / total * 100) if total else 0.0
              flow_rate = (m['flowHit'] / total * 100) if total else 0.0
              bl = m['baseline'] * 100
              delta = rate - bl
              low = (m['lowCy'] / total * 100) if total else 0.0
              avg_jump = (m['sumJumpWeighted'] / m['pairCount']) if m['pairCount'] else 0.0
              jump_big_rate = (m['jumpBig'] / m['pairCount'] * 100) if m['pairCount'] else 0.0
              bridged = (m['bridgedHit'] / total * 100) if total else 0.0
              bridged10 = (m['bridgedHit10'] / total * 100) if total else 0.0
              srcs = f"{m['srcMp']}/{m['srcEnh']}/{m['srcBbox']}/{m['srcRoi']}/{m['srcLow']}/{m['srcTile']}/{m['srcFlow']}"
              half_label = '+'.join(sorted(m['halves'])) or '?'
              out.append(f"| {video} | {backend} | {half_label} | {m['hit']} | {total} | {rate:.1f}% | {flow_rate:.1f}% | {bl:.0f}% | {delta:+.1f}pp | {bridged:.1f}% | {bridged10:.1f}% | {low:.1f}% | {avg_jump:.4f} | {jump_big_rate:.1f}% | {srcs} |")
          summary = '\n'.join(out) + '\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary)
          print(summary)
          PYEOF
